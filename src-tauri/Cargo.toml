[package]
name = "gitwave"
version = "0.11.0"
description = "GitWave — local-first Git client with AI collaboration"
license = "MIT"
authors = ["Yangzhenbiao <yangshifu1024@qq.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# MSVC link.exe prints localized "Creating library ..." notes on every link;
# newer rustc surfaces that stdout as linker_messages warnings. Pure noise.
linker_messages = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The application, domain and infrastructure layers (Git, SQLite, AI, proxy,
# credential stores). This crate is the Tauri shell around them.
gitwave-core = { path = "../crates/gitwave-core" }

# 2.12.2 fixes macOS bundle relaunch inheriting the exiting process's stdio.
tauri = { version = "2.12.2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# `tauri::generate_context!` expands to code that names `serde_json` directly.
serde_json = "1"
tracing = "0.1"
# Feature unification only — never imported. tauri-plugin-updater builds its
# own reqwest 0.13 client with default-features = false and exposes no proxy
# option at plugin-build time; this dependency flips `system-proxy` on for the
# single shared reqwest 0.13 build so update checks follow the proxy too.
# NOTE: if the updater plugin ever moves to reqwest 0.14, this stops
# unifying and its proxy support silently regresses — re-check on upgrade.
reqwest-updater-unification = { package = "reqwest", version = "0.13", default-features = false, features = ["system-proxy"] }
tauri-plugin-decoration = "3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Window chrome tweaks in `macos_window.rs`: instant zoom on a title-bar
# double-click instead of the animated AppKit zoom.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSScreen"] }

# Sprint 2 step 5: typed IPC — fallback to manual typed commands for Sprint 0
# (tauri-specta may be added in Sprint 1 once adapter signatures stabilize).
# See docs/tasks/feat-bootstrap-tau-app/plan.md.
