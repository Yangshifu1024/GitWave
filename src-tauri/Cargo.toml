[package]
name = "gitwave"
version = "0.7.14"
description = "GitWave — local-first Git client with AI collaboration"
license = "MIT"
authors = ["Yangzhenbiao <yangshifu1024@qq.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# MSVC link.exe prints localized "Creating library ..." notes on every link;
# newer rustc surfaces that stdout as linker_messages warnings. Pure noise.
linker_messages = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"

# Sprint 2 step 6: persistence + git backend
dirs = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
# `ssh` compiles the libssh2 transport into vendored libgit2 — without it
# SSH remotes fail on every platform. libssh2 speaks to ssh-agent via
# SSH_AUTH_SOCK on unix and the OpenSSH Agent named pipe on Windows, so
# `Cred::ssh_key_from_agent` works on both once the feature is on.
# `https` compiles a TLS transport into vendored libgit2 (Secure Transport
# on macOS, OpenSSL elsewhere) — without it every HTTPS fetch fails with
# "there is no TLS stream available; class=Ssl (16)". Both features must be
# declared explicitly: git2 0.21 changed `default` from ["ssh", "https"]
# to [].
# `vendored-openssl` static-links OpenSSL: libssh2-sys pulls openssl-sys,
# which on macOS otherwise links Homebrew's libssl and the app crashes on
# launch (missing dylib / Team-ID mismatch under library validation).
git2 = { version = "0.21", features = ["https", "vendored-libgit2", "ssh", "vendored-openssl"] }
# No compiled-in backend here — each OS enables only its native store via
# the `[target.*.dependencies]` sections below (keeps e.g. D-Bus off
# macOS/Windows). Pattern mirrors `reqwest`'s `default-features = false`.
keyring = { version = "3", default-features = false }
# `system-proxy` lets reqwest read the OS proxy (Windows registry / macOS
# SystemConfiguration) as a fallback on top of the env vars injected by
# infrastructure/proxy.rs — covers formats our own parser rejects.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
# Feature unification only — never imported. tauri-plugin-updater builds its
# own reqwest 0.13 client with default-features = false and exposes no proxy
# option at plugin-build time; this dependency flips `system-proxy` on for the
# single shared reqwest 0.13 build so update checks follow the proxy too.
# NOTE: if the updater plugin ever moves to reqwest 0.14, this stops
# unifying and its proxy support silently regresses — re-check on upgrade.
reqwest-updater-unification = { package = "reqwest", version = "0.13", default-features = false, features = ["system-proxy"] }
tauri-plugin-decoration = "3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# System proxy probe (F013). Version range matches hyper-util's optional dep
# so the graph resolves a single shared build.
windows-registry = "0.100"
# Native credential store (Credential Manager) for this target only.
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
# System proxy probe (F013), same crate + API hyper-util uses for reqwest.
system-configuration = "0.8"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSScreen"] }
# Native credential store (Keychain) for this target only.
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Secret Service (D-Bus) credential store for Linux/BSD only.
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }

# Sprint 2 step 5: typed IPC — fallback to manual typed commands for Sprint 0
# (tauri-specta may be added in Sprint 1 once adapter signatures stabilize).
# See docs/tasks/feat-bootstrap-tau-app/plan.md.
