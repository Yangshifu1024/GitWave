[package]
name = "gitwave"
version = "0.4.0"
description = "GitWave — local-first Git client with AI collaboration"
license = "MIT"
authors = ["Yangzhenbiao <yangshifu1024@qq.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# MSVC link.exe prints localized "Creating library ..." notes on every link;
# newer rustc surfaces that stdout as linker_messages warnings. Pure noise.
linker_messages = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
thiserror = "1"
anyhow = "1"

# Sprint 2 step 6: persistence + git backend
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
# `ssh` compiles the libssh2 transport into vendored libgit2 — without it
# SSH remotes fail on every platform. libssh2 speaks to ssh-agent via
# SSH_AUTH_SOCK on unix and the OpenSSH Agent named pipe on Windows, so
# `Cred::ssh_key_from_agent` works on both once the feature is on.
# `vendored-openssl` static-links OpenSSL: libssh2-sys pulls openssl-sys,
# which on macOS otherwise links Homebrew's libssl and the app crashes on
# launch (missing dylib / Team-ID mismatch under library validation).
git2 = { version = "0.20", features = ["vendored-libgit2", "ssh", "vendored-openssl"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-decoration = "3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSScreen"] }

# Sprint 2 step 5: typed IPC — fallback to manual typed commands for Sprint 0
# (tauri-specta may be added in Sprint 1 once adapter signatures stabilize).
# See docs/tasks/feat-bootstrap-tau-app/plan.md.
