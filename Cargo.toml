[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Yangzhenbiao <yangshifu1024@qq.com>"]
repository = "https://github.com/Yangshifu1024/GitWave"

[workspace.dependencies]
# The application, domain and infrastructure layers the GPUI Kit application calls.
gitwave-core = { path = "crates/gitwave-core" }

# GPUI Kit is pre-1.0 and every minor release ships breaking changes, so the version
# is pinned exactly. Upgrading is a deliberate step, not `cargo update`.
# See docs/tech/tech-selection/gpui-kit-research.md.
gpui-kit = { version = "=0.11.0", features = ["syntect"] }

# The interface text; gpui-component reads its own messages with the same crate.
rust-i18n = "4.2"
# GPUI has its own executors; gitwave-core's use cases are async and need tokio.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

# The languages the system reports. Already in the graph: GPUI reads them too.
sys-locale = "0.3"
# What gitwave-core logs with; the application starts the subscriber and uses it for its own warnings.
tracing = "0.1"
# Dates in the interface, for commits older than a week. Already in the graph
# with these features.
chrono = "0.4"

# GPUI lays out and rasterises text on the main thread, which is unusably slow without
# optimisation. Dependencies are optimised while workspace crates stay fast to compile.
[profile.dev.package."*"]
opt-level = 1
