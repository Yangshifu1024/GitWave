version: 2

updates:
  # 前端 / JS 工具链（package.json + pnpm-lock.yaml）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  # Rust 后端（src-tauri/Cargo.toml + Cargo.lock）
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
