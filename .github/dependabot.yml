version: 2

updates:
  # Rust workspace（Cargo.toml + Cargo.lock）：gitwave-core 与 GPUI Kit 应用
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # GPUI Kit is pinned exactly because every minor release ships breaking
      # changes; upgrading it is a deliberate task (ADR 0007).
      - dependency-name: "gpui-kit"
      # keyring 4 renamed the features the credential stores are enabled with.
      # Moving to it is a deliberate change; 3.x updates still come through.
      - dependency-name: "keyring"
        update-types: ["version-update:semver-major"]
