name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-test:
    name: Rust test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          # The runner image ships Google's Chrome apt source, which
          # intermittently fails `apt-get update` with a hash mismatch;
          # it is irrelevant to this job, so drop it before updating.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.*
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-targets
      # Guards against silently losing TLS in vendored libgit2 (git2 0.21
      # dropped `https` from default features; the app then fails every
      # HTTPS fetch with "there is no TLS stream available; class=Ssl (16)").
      - name: Assert libgit2 built with a TLS transport
        shell: bash
        run: |
          header=$(find src-tauri/target -path '*/out/include/git2_features.h' -print -quit)
          test -n "$header" || { echo "::error::git2_features.h not found under src-tauri/target"; exit 1; }
          grep -q '^#define GIT_HTTPS 1$' "$header" || {
            echo "::error::vendored libgit2 was built without a TLS transport (GIT_HTTPS missing) — is the git2 'https' feature still enabled in src-tauri/Cargo.toml?"
            exit 1
          }
          grep '^#define GIT_\(SECURE_TRANSPORT\|WINHTTP\|OPENSSL\) 1$' "$header"

  frontend-test:
    name: Frontend test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: vitest
        run: pnpm test