name: Tauri preference exporter release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release
    if: github.repository == 'Yangshifu1024/GitWave' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      # Full history + tags so the notes step can diff against the previous tag.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Verify the preference exporter tag
        run: |
          set -euo pipefail
          version=$(jq -er .version src-tauri/tauri.conf.json)
          [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF_NAME" = "v$version"
          jq -e '.plugins.updater.requireSignedVersion == true and (.plugins.updater.endpoints[0] | endswith("/gitwave-legacy-transition.json"))' src-tauri/tauri.conf.json
      # generate_release_notes only lists merged PRs, but this repo's release
      # flow pushes release commits directly — it produced an empty body on
      # v0.8.3. List every commit between the previous tag and this one; the
      # same text feeds the verified updater manifest from the draft body.
      - name: Build release notes
        run: |
          prev_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## What's Changed"
            if [ -n "$prev_tag" ]; then
              git log --format='- %h %s' "${prev_tag}..${GITHUB_REF_NAME}"
              echo
              echo "Full Changelog: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            else
              echo "- First tagged release"
            fi
          } > release-notes.md
      # The build jobs upload installers. The last job verifies the installers
      # and attaches the updater feed to the draft for manual publication.
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          tag="$GITHUB_REF_NAME"
          releases="repos/$GITHUB_REPOSITORY/releases?per_page=100"
          existing=$(gh api --paginate --slurp "$releases")
          if jq -e --arg tag "$tag" 'any(.[][]; .tag_name == $tag)' <<< "$existing" > /dev/null; then
            echo "A release already exists for $tag." >&2
            exit 1
          fi
          bash scripts/verify-release-tag.sh "$repository" "$tag" "$GITHUB_SHA"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$tag" --notes-file release-notes.md
          bash scripts/verify-release-tag.sh "$repository" "$tag" "$GITHUB_SHA"
          id=$(gh api --paginate --slurp "$releases" | jq -er --arg tag "$tag" '
            [.[][] | select(.tag_name == $tag)] |
            if length == 1 and .[0].draft then .[0].id else error("expected one new draft") end
          ')
          printf 'id=%s\n' "$id" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build (macOS)
    needs: prepare-release
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s\n' "$APPLE_API_KEY_P8" > AuthKey.p8
          grep -q '^-----BEGIN PRIVATE KEY-----$' AuthKey.p8 || {
            echo "::error::APPLE_API_KEY_P8 缺少 '-----BEGIN PRIVATE KEY-----' 行，内容已损坏。用 gh secret set APPLE_API_KEY_P8 < AuthKey_XXX.p8 重新设置"
            exit 1
          }
          grep -q '^-----END PRIVATE KEY-----$' AuthKey.p8 || {
            echo "::error::APPLE_API_KEY_P8 缺少 '-----END PRIVATE KEY-----' 行，内容已损坏。用 gh secret set APPLE_API_KEY_P8 < AuthKey_XXX.p8 重新设置"
            exit 1
          }
      - name: Tauri build
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # certificate + notarization are handled inside the action/bundler
          # (temp keychain import, codesign, notarytool, staple)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ github.workspace }}/AuthKey.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          uploadUpdaterJson: "false"
          uploadUpdaterSignatures: "true"
          args: --verbose
      # The bundler notarizes and staples the .app but only codesigns the dmg,
      # so Gatekeeper rejects the dmg itself ("Unnotarized Developer ID", seen
      # on v0.8.2). Re-notarize + staple it and replace the uploaded asset.
      - name: Notarize and staple dmg
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_API_KEY" ]; then
            echo "No notarization credentials configured; skipping dmg notarization"
            exit 0
          fi
          gh release download "${GITHUB_REF_NAME}" --pattern '*.dmg' --clobber
          dmg=$(ls *.dmg | head -1)
          xcrun notarytool submit "$dmg" \
            --key "${{ github.workspace }}/AuthKey.p8" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)" = true
          gh release upload "${GITHUB_REF_NAME}" "$dmg" --clobber

  build-linux:
    name: Build (Linux)
    needs: prepare-release
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Tauri Linux deps
        run: |
          # The runner image ships Google's Chrome apt source, which
          # intermittently fails `apt-get update` with a hash mismatch;
          # it is irrelevant to this job, so drop it before updating.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.*
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Tauri build
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          uploadUpdaterJson: "false"
          uploadUpdaterSignatures: "true"
          args: --verbose

  build-windows:
    name: Build (Windows)
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Tauri build
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          uploadUpdaterJson: "false"
          uploadUpdaterSignatures: "true"
          args: --verbose

  verify-exporter-feed:
    name: Verify preference exporter update feed
    needs: [prepare-release, build-macos, build-linux, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify signed installers and upload latest.json to the draft
        shell: bash
        run: |
          set -euo pipefail
          [[ ${RELEASE_ID:-} =~ ^[0-9]+$ ]]
          tag="$GITHUB_REF_NAME"
          release="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          read_draft() {
            gh api "$release" | jq -ce --arg tag "$tag" 'select(.draft and .tag_name == $tag)'
          }
          download_asset() {
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$1" -H 'Accept: application/octet-stream'
          }
          draft=$(read_draft)
          jq -r '.body // ""' <<< "$draft" > "$work/notes.md"
          mkdir "$work/assets"
          gh api "$release/assets" --paginate --jq '
            .[] | select(.state == "uploaded" and (.name | test("^[A-Za-z0-9._-]+[.](app[.]tar[.]gz|exe|AppImage|deb|rpm|sig)$"))) |
            [.id, .name] | @tsv' > "$work/assets.tsv"
          while IFS=$'\t' read -r id name; do
            download_asset "$id" > "$work/assets/$name"
          done < "$work/assets.tsv"
          go run ./cmd/prepare-legacy-feeds -export-only -export-version "${tag#v}" \
            -export-assets "$work/assets" -export-notes "$work/notes.md" -out "$work/verified"
          read_draft >/dev/null
          asset_id=$(gh api "$release/assets" --paginate --jq '.[] | select(.name == "latest.json") | .id')
          if [[ ! $asset_id ]]; then
            # Upload to the verified release ID. GitHub rejects an existing asset of the same name.
            asset_id=$(printf 'Authorization: Bearer %s\n' "$GH_TOKEN" |
              curl --fail-with-body --silent --show-error --header @- \
                --header 'Content-Type: application/json' --data-binary "@$work/verified/latest.json" \
                "https://uploads.github.com/$release/assets?name=latest.json" | jq -er '.id')
          fi
          download_asset "$asset_id" > "$work/uploaded.json"
          if ! cmp -s "$work/verified/latest.json" "$work/uploaded.json"; then
            echo 'The draft already has a different latest.json. Review the existing asset and rerun verification.' >&2
            exit 1
          fi
