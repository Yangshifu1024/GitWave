name: build

on:
  push:
    tags: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})"
            exit 1
          fi
      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

  build-macos:
    name: Build (macOS)
    needs: prepare-release
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s\n' "$APPLE_API_KEY_P8" > AuthKey.p8
          grep -q '^-----BEGIN PRIVATE KEY-----$' AuthKey.p8 || {
            echo "::error::APPLE_API_KEY_P8 缺少 '-----BEGIN PRIVATE KEY-----' 行，内容已损坏。用 gh secret set APPLE_API_KEY_P8 < AuthKey_XXX.p8 重新设置"
            exit 1
          }
          grep -q '^-----END PRIVATE KEY-----$' AuthKey.p8 || {
            echo "::error::APPLE_API_KEY_P8 缺少 '-----END PRIVATE KEY-----' 行，内容已损坏。用 gh secret set APPLE_API_KEY_P8 < AuthKey_XXX.p8 重新设置"
            exit 1
          }
      - name: Tauri build
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # certificate + notarization are handled inside the action/bundler
          # (temp keychain import, codesign, notarytool, staple)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ github.workspace }}/AuthKey.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: --verbose

  build-linux:
    name: Build (Linux)
    needs: prepare-release
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf
      - name: npm ci
        run: npm ci
      - name: Tauri build
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: --verbose

  build-windows:
    name: Build (Windows)
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Tauri build
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: --verbose

  publish:
    name: Publish release
    needs: [prepare-release, build-macos, build-linux, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Download updater signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --dir sigs --pattern '*.sig'
      - name: Build updater manifest (latest.json)
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          // One updater manifest per release: maps each auto-updatable
          // platform to its signed artifact. Exactly one .sig per platform
          // is required — zero means the build didn't sign, two means the
          // glob caught junk; both would silently break clients.
          const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const tag = process.env.GITHUB_REF_NAME;
          const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}`;

          const readSig = (file) => {
            const s = fs.readFileSync(file, "utf8").trim();
            if (!s) throw new Error(`empty signature file: ${file}`);
            return s;
          };
          const findSig = (re) => {
            const hits = fs.readdirSync("sigs").filter((f) => re.test(f));
            if (hits.length !== 1) {
              throw new Error(`expected exactly one ${re} in sigs/, got ${hits.length}`);
            }
            return path.join("sigs", hits[0]);
          };

          const macSig = findSig(/^GitWave\.app\.tar\.gz\.sig$/);
          const linuxSig = findSig(/\.AppImage\.sig$/);
          const winSig = findSig(/-setup\.exe\.sig$/);

          const manifest = {
            version,
            notes: `GitWave ${tag}`,
            pub_date: new Date().toISOString(),
            platforms: {
              "darwin-aarch64": {
                signature: readSig(macSig),
                url: `${base}/${path.basename(macSig).replace(/\.sig$/, "")}`,
              },
              "linux-x86_64": {
                signature: readSig(linuxSig),
                url: `${base}/${path.basename(linuxSig).replace(/\.sig$/, "")}`,
              },
              "windows-x86_64": {
                signature: readSig(winSig),
                url: `${base}/${path.basename(winSig).replace(/\.sig$/, "")}`,
              },
            },
          };
          fs.writeFileSync("latest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(manifest);
          NODE
      - name: Upload updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" latest.json --clobber
      # no auto-publish: the release stays a draft for human review —
      # check the assets, latest.json and release notes, then hit publish
