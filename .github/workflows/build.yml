name: build

on:
  push:
    tags: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build (macOS)
    # macos-latest (macOS 26 pool) egress to timestamp.apple.com is broken; try the macOS 15 pool
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s\n' "$APPLE_API_KEY_P8" > AuthKey.p8
          grep -q '^-----BEGIN PRIVATE KEY-----$' AuthKey.p8 || {
            echo "::error::APPLE_API_KEY_P8 缺少 '-----BEGIN PRIVATE KEY-----' 行，内容已损坏。用 gh secret set APPLE_API_KEY_P8 < AuthKey_XXX.p8 重新设置"
            exit 1
          }
          grep -q '^-----END PRIVATE KEY-----$' AuthKey.p8 || {
            echo "::error::APPLE_API_KEY_P8 缺少 '-----END PRIVATE KEY-----' 行，内容已损坏。用 gh secret set APPLE_API_KEY_P8 < AuthKey_XXX.p8 重新设置"
            exit 1
          }
      - name: Probe Apple TSA (fail fast before compile)
        run: |
          security find-identity -v -p codesigning build.keychain || true
          probe() { curl -sS -o /dev/null --connect-timeout 10 --max-time 20 https://timestamp.apple.com/ts01; }
          if probe; then echo "TSA reachable directly"; exit 0; fi
          for host in api.appstoreconnect.apple.com itunes.apple.com www.apple.com; do
            curl -sS -o /dev/null -w "$host: HTTP %{http_code} in %{time_total}s\n" \
              --connect-timeout 10 --max-time 20 "https://$host/" || echo "$host: unreachable"
          done
          echo "Direct egress failed; pinning timestamp.apple.com -> 17.157.80.35 in /etc/hosts"
          echo "17.157.80.35 timestamp.apple.com" | sudo tee -a /etc/hosts >/dev/null
          dscacheutil -flushcache || true
          killall -HUP mDNSResponder 2>/dev/null || true
          ok=0
          for i in 1 2 3; do
            if probe; then ok=1; break; fi
            echo "TSA attempt $i failed; sleeping 20s before retry"
            sleep 20
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Apple TSA unreachable even with pinned IP — codesign would hang. Failing fast before the 20-min compile."
            exit 1
          fi
          echo "TSA reachable via pinned IP 17.157.80.35"
      - name: frontend build
        run: npm run build
      - name: cargo build (compile phase)
        run: cargo build --manifest-path src-tauri/Cargo.toml --release
      - name: tauri build (bundle + sign + notarize, verbose)
        run: perl -e 'alarm shift; exec @ARGV' 2100 npm run tauri -- build --verbose
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ github.workspace }}/AuthKey.p8
      - uses: actions/upload-artifact@v7
        with:
          name: gitwave-macos
          path: |
            src-tauri/target/release/bundle/macos/*
            src-tauri/target/release/bundle/dmg/*
          if-no-files-found: error

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf
      - name: npm ci
        run: npm ci
      - name: tauri build
        run: npm run tauri -- build
      - uses: actions/upload-artifact@v7
        with:
          name: gitwave-linux
          path: |
            src-tauri/target/release/bundle/deb/*
            src-tauri/target/release/bundle/rpm/*
            src-tauri/target/release/bundle/appimage/*
          if-no-files-found: error

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: npm ci
        run: npm ci
      - name: tauri build
        run: npm run tauri -- build
      - uses: actions/upload-artifact@v7
        with:
          name: gitwave-windows
          path: |
            src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

  release:
    name: Release
    needs: [build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/gitwave-macos/dmg/*.dmg
            artifacts/gitwave-linux/deb/*
            artifacts/gitwave-linux/rpm/*
            artifacts/gitwave-linux/appimage/*
            artifacts/gitwave-windows/*
