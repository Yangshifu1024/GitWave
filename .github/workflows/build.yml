name: build

on:
  push:
    tags: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build (macOS)
    # macos-latest (macOS 26 pool) egress to timestamp.apple.com is broken; try the macOS 15 pool
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s\n' "$APPLE_API_KEY_P8" > AuthKey.p8
          grep -q '^-----BEGIN PRIVATE KEY-----$' AuthKey.p8 || {
            echo "::error::APPLE_API_KEY_P8 缺少 '-----BEGIN PRIVATE KEY-----' 行，内容已损坏。用 gh secret set APPLE_API_KEY_P8 < AuthKey_XXX.p8 重新设置"
            exit 1
          }
          grep -q '^-----END PRIVATE KEY-----$' AuthKey.p8 || {
            echo "::error::APPLE_API_KEY_P8 缺少 '-----END PRIVATE KEY-----' 行，内容已损坏。用 gh secret set APPLE_API_KEY_P8 < AuthKey_XXX.p8 重新设置"
            exit 1
          }
      - name: Probe Apple TSA (fail fast before compile)
        run: |
          security find-identity -v -p codesigning build.keychain || true
          probe() { curl -sS -o /dev/null --connect-timeout 10 --max-time 20 https://timestamp.apple.com/ts01; }
          if probe; then echo "TSA reachable directly"; exit 0; fi
          echo "--- proxy env ---"
          env | grep -iE "^(http_proxy|https_proxy|all_proxy|no_proxy)=" || echo "(no proxy env vars)"
          echo "--- system resolve of timestamp.apple.com ---"
          dscacheutil -q host -a name timestamp.apple.com || true
          echo "--- curl -v full output (443) ---"
          curl -v --connect-timeout 10 --max-time 20 https://timestamp.apple.com/ts01 -o /dev/null 2>&1 || true
          echo "--- curl -v full output (80) ---"
          curl -v --connect-timeout 10 --max-time 20 http://timestamp.apple.com/ -o /dev/null 2>&1 || true
          echo "--- TSA endpoint reachability: 80 vs 443 ---"
          curl -sS -o /dev/null -w "http  ts01 POST: HTTP %{http_code} in %{time_total}s\n" -X POST -H "Content-Type: application/timestamp-query" --data-binary "probe" --connect-timeout 10 --max-time 20 http://timestamp.apple.com/ts01 || echo "http  ts01: failed"
          curl -sS -o /dev/null -w "https ts01 POST: HTTP %{http_code} in %{time_total}s\n" -X POST -H "Content-Type: application/timestamp-query" --data-binary "probe" --connect-timeout 10 --max-time 20 https://timestamp.apple.com/ts01 || echo "https ts01: failed"
          echo "--- curl --resolve forced to 17.157.80.35 ---"
          if curl -sS -o /dev/null --resolve timestamp.apple.com:443:17.157.80.35 --connect-timeout 10 --max-time 20 https://timestamp.apple.com/ts01; then
            echo "RESOLVED-IP PATH WORKS"
          else
            echo "resolved-IP path also blocked"
          fi
          echo "Pinning /etc/hosts and retrying"
          echo "17.157.80.35 timestamp.apple.com" | sudo tee -a /etc/hosts >/dev/null
          dscacheutil -flushcache || true
          killall -HUP mDNSResponder 2>/dev/null || true
          ok=0
          for i in 1 2 3; do
            if probe; then ok=1; break; fi
            echo "TSA attempt $i failed; sleeping 20s before retry"
            sleep 20
          done
          if [ "$ok" = 1 ]; then
            echo "TSA reachable via pinned IP 17.157.80.35"
            exit 0
          fi
          echo "HTTPS TSA unreachable; checking HTTP TSA fallback (ts01 over port 80)"
          if ! curl -sS -o /dev/null --connect-timeout 10 --max-time 20 -X POST -H "Content-Type: application/timestamp-query" --data-binary "probe" http://timestamp.apple.com/ts01; then
            echo "::error::Apple TSA unreachable over both HTTPS and HTTP — codesign cannot take a timestamp. Failing fast before the 20-min compile."
            exit 1
          fi
          echo "--- smoke test: real codesign with HTTP timestamp URL (60s limit) ---"
          cp /bin/echo /tmp/gw_sig_test
          id_hash=$(security find-identity -v -p codesigning build.keychain | awk '$1 ~ /^[0-9]+\)$/ {print $2; exit}')
          echo "identity hash: $id_hash"
          if perl -e 'alarm shift; exec @ARGV' 60 codesign --force --timestamp=http://timestamp.apple.com/ts01 -s "$id_hash" --options runtime /tmp/gw_sig_test; then
            echo "codesign HTTP TSA smoke test PASSED"
          else
            echo "::error::codesign cannot take a timestamp over HTTP either (curl works but codesign hangs). See job log."
            exit 1
          fi
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/codesign" <<'WRAPPER'
          #!/bin/bash
          if [ -x /usr/bin/codesign.real ]; then REAL=/usr/bin/codesign.real; else REAL=/usr/bin/codesign; fi
          echo "[codesign-wrapper] real=$REAL args=$*" >&2
          out=(--timestamp=http://timestamp.apple.com/ts01)
          skip=0
          for a in "$@"; do
            if [ "$skip" = 1 ]; then skip=0; continue; fi
            case "$a" in
              --timestamp=*) ;;
              --timestamp) skip=1 ;;
              *) out+=("$a") ;;
            esac
          done
          echo "[codesign-wrapper] out=${out[*]}" >&2
          exec "$REAL" "${out[@]}"
          WRAPPER
          chmod +x "$HOME/.local/bin/codesign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # also replace /usr/bin/codesign when the volume allows, to cover absolute-path invocations
          if [ ! -e /usr/bin/codesign.real ]; then
            sudo mount -uw / 2>/dev/null || true
            if sudo mv /usr/bin/codesign /usr/bin/codesign.real 2>/dev/null && sudo cp "$HOME/.local/bin/codesign" /usr/bin/codesign; then
              echo "/usr/bin/codesign replaced (covers absolute-path calls)"
            else
              echo "/usr/bin/codesign replace failed — relying on PATH wrapper"
            fi
          else
            sudo cp "$HOME/.local/bin/codesign" /usr/bin/codesign
          fi
          echo "codesign wrappers installed: timestamp forced to http://timestamp.apple.com/ts01"
      - name: frontend build
        run: npm run build
      - name: cargo build (compile phase)
        run: cargo build --manifest-path src-tauri/Cargo.toml --release
      - name: Big-binary HTTP TSA signing experiment
        run: |
          bin=src-tauri/target/release/gitwave
          ls -la "$bin"
          id_hash=$(security find-identity -v -p codesigning build.keychain | awk '$1 ~ /^[0-9]+\)$/ {print $2; exit}')
          echo "--- a) HTTP TSA on real binary (120s limit) ---"
          if perl -e 'alarm shift; exec @ARGV' 120 codesign --force --timestamp=http://timestamp.apple.com/ts01 -s "$id_hash" --options runtime "$bin"; then
            echo "HTTP TSA big-binary: PASSED"
          else
            echo "HTTP TSA big-binary: FAILED/hung"
          fi
          echo "--- b) no-timestamp control (120s limit) ---"
          if perl -e 'alarm shift; exec @ARGV' 120 codesign --force --timestamp=none -s "$id_hash" --options runtime "$bin"; then
            echo "no-timestamp control: PASSED"
          else
            echo "no-timestamp control: FAILED/hung"
          fi
      - name: tauri build (bundle + sign + notarize, verbose)
        run: perl -e 'alarm shift; exec @ARGV' 2100 npm run tauri -- build --verbose
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ github.workspace }}/AuthKey.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: gitwave-macos
          path: |
            src-tauri/target/release/bundle/macos/*
            src-tauri/target/release/bundle/dmg/*
          if-no-files-found: error

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf
      - name: npm ci
        run: npm ci
      - name: tauri build
        run: npm run tauri -- build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: gitwave-linux
          path: |
            src-tauri/target/release/bundle/deb/*
            src-tauri/target/release/bundle/rpm/*
            src-tauri/target/release/bundle/appimage/*
          if-no-files-found: error

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: npm ci
        run: npm ci
      - name: tauri build
        run: npm run tauri -- build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: gitwave-windows
          path: |
            src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

  release:
    name: Release
    needs: [build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Build updater manifest (latest.json)
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          // One updater manifest per release: maps each auto-updatable
          // platform to its signed artifact. Exactly one .sig per platform
          // is required — zero means the build didn't sign, two means the
          // glob caught junk; both would silently break clients.
          const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const tag = process.env.GITHUB_REF_NAME;
          // The manifest's version drives the client-side "is this newer"
          // comparison while the URLs serve the tag's assets; a mismatch
          // between the two is a silent dead update channel for everyone.
          if (tag !== `v${version}`) {
            throw new Error(
              `tag ${tag} does not match package.json version ${version} (expected v${version})`,
            );
          }
          const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}`;

          const readSig = (file) => {
            const s = fs.readFileSync(file, "utf8").trim();
            if (!s) throw new Error(`empty signature file: ${file}`);
            return s;
          };
          const findSig = (dir, re) => {
            const hits = fs.existsSync(dir) ? fs.readdirSync(dir).filter((f) => re.test(f)) : [];
            if (hits.length !== 1) {
              throw new Error(`expected exactly one ${re} in ${dir}, got ${hits.length}`);
            }
            return path.join(dir, hits[0]);
          };

          const macSig = findSig("artifacts/gitwave-macos/macos", /^GitWave\.app\.tar\.gz\.sig$/);
          const linuxSig = findSig("artifacts/gitwave-linux/appimage", /\.AppImage\.sig$/);
          const winSig = findSig("artifacts/gitwave-windows", /-setup\.exe\.sig$/);

          const manifest = {
            version,
            notes: `GitWave ${tag}`,
            pub_date: new Date().toISOString(),
            platforms: {
              "darwin-aarch64": {
                signature: readSig(macSig),
                url: `${base}/${path.basename(macSig).replace(/\.sig$/, "")}`,
              },
              "linux-x86_64": {
                signature: readSig(linuxSig),
                url: `${base}/${path.basename(linuxSig).replace(/\.sig$/, "")}`,
              },
              "windows-x86_64": {
                signature: readSig(winSig),
                url: `${base}/${path.basename(winSig).replace(/\.sig$/, "")}`,
              },
            },
          };
          fs.writeFileSync("artifacts/latest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(manifest);
          NODE
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/gitwave-macos/dmg/*.dmg
            artifacts/gitwave-macos/macos/*.app.tar.gz
            artifacts/gitwave-macos/macos/*.app.tar.gz.sig
            artifacts/gitwave-linux/deb/*
            artifacts/gitwave-linux/rpm/*
            artifacts/gitwave-linux/appimage/*
            artifacts/gitwave-windows/*
            artifacts/latest.json
