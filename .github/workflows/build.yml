name: build

on:
  push:
    tags: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      release_notes: ${{ steps.notes.outputs.body }}
    steps:
      # Full history + tags so the notes step can diff against the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # generate_release_notes only lists merged PRs, but this repo's release
      # flow pushes release commits directly — it produced an empty body on
      # v0.8.3. List every commit between the previous tag and this one; the
      # same text feeds the updater manifest via tauri-action's releaseBody.
      - name: Build release notes
        id: notes
        run: |
          prev_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## What's Changed"
            if [ -n "$prev_tag" ]; then
              git log --format='- %h %s' "${prev_tag}..${GITHUB_REF_NAME}"
              echo
              echo "Full Changelog: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            else
              echo "- First tagged release"
            fi
          } > release-notes.md
          {
            echo "body<<NOTES_EOF"
            cat release-notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      # draft: tauri-action uploads artifacts + latest.json but never
      # publishes — a human reviews assets/notes and hits publish manually
      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md

  build-macos:
    name: Build (macOS)
    needs: prepare-release
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s\n' "$APPLE_API_KEY_P8" > AuthKey.p8
          grep -q '^-----BEGIN PRIVATE KEY-----$' AuthKey.p8 || {
            echo "::error::APPLE_API_KEY_P8 缺少 '-----BEGIN PRIVATE KEY-----' 行，内容已损坏。用 gh secret set APPLE_API_KEY_P8 < AuthKey_XXX.p8 重新设置"
            exit 1
          }
          grep -q '^-----END PRIVATE KEY-----$' AuthKey.p8 || {
            echo "::error::APPLE_API_KEY_P8 缺少 '-----END PRIVATE KEY-----' 行，内容已损坏。用 gh secret set APPLE_API_KEY_P8 < AuthKey_XXX.p8 重新设置"
            exit 1
          }
      - name: Tauri build
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # certificate + notarization are handled inside the action/bundler
          # (temp keychain import, codesign, notarytool, staple)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ github.workspace }}/AuthKey.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseBody: ${{ needs.prepare-release.outputs.release_notes }}
          args: --verbose
      # The bundler notarizes and staples the .app but only codesigns the dmg,
      # so Gatekeeper rejects the dmg itself ("Unnotarized Developer ID", seen
      # on v0.8.2). Re-notarize + staple it and replace the uploaded asset.
      - name: Notarize and staple dmg
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_API_KEY" ]; then
            echo "No notarization credentials configured; skipping dmg notarization"
            exit 0
          fi
          gh release download "${GITHUB_REF_NAME}" --pattern '*.dmg' --clobber
          dmg=$(ls *.dmg | head -1)
          xcrun notarytool submit "$dmg" \
            --key "${{ github.workspace }}/AuthKey.p8" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          gh release upload "${GITHUB_REF_NAME}" "$dmg" --clobber

  build-linux:
    name: Build (Linux)
    needs: prepare-release
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Tauri Linux deps
        run: |
          # The runner image ships Google's Chrome apt source, which
          # intermittently fails `apt-get update` with a hash mismatch;
          # it is irrelevant to this job, so drop it before updating.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.*
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Tauri build
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseBody: ${{ needs.prepare-release.outputs.release_notes }}
          args: --verbose

  build-windows:
    name: Build (Windows)
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Tauri build
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseBody: ${{ needs.prepare-release.outputs.release_notes }}
          args: --verbose

  # tauri-action writes the updater manifest with API asset URLs
  # (https://api.github.com/repos/<owner>/<repo>/releases/assets/<id>). Those
  # answer 403 when the request carries no User-Agent header and they count
  # against GitHub's unauthenticated API quota (60 requests/hour per IP), so
  # the in-app updater failed with 403 on v0.9.2. Every asset is uploaded once
  # the last build finishes, so rewrite the URLs to plain download links
  # (https://github.com/<owner>/<repo>/releases/download/<tag>/<file>) and
  # replace the uploaded manifest — the file the updater actually reads.
  #
  # Two facts about running this against a draft release — the first real run,
  # on v0.9.3, died on both (see
  # docs/tasks/fix-rewrite-manifest-draft/plan.md):
  #   - GET /releases/tags/<tag> answers 404 for a draft, so direct API calls
  #     go through prepare-release's release id. (`gh release download/upload`
  #     are fine on a draft: gh resolves the tag through the releases list,
  #     which does include it.)
  #   - browser_download_url of a draft asset is
  #     releases/download/untagged-<hash>/<file>, not the published
  #     releases/download/<tag>/<file> the updater needs — build the URL from
  #     the tag and the asset name instead.
  # The job-level permissions below are load-bearing: job-level overrides the
  # workflow level, and a draft release is only visible to a token with push
  # permission (set to contents: read once and gh answered "release not found"
  # — see docs/tasks/fix-ci-redundant-publish-job/plan.md).
  rewrite-manifest-urls:
    name: Rewrite updater manifest URLs
    needs: [prepare-release, build-macos, build-linux, build-windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
    steps:
      - name: Rewrite API asset URLs to download URLs
        run: |
          set -euo pipefail
          : "${RELEASE_ID:?prepare-release did not output a release id}"
          # Deliberate, not leftover: the runner image's gh version is what
          # decides how a draft release is resolved, so keep it in the log.
          gh --version
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --clobber
          # asset id -> published download link, plus the set of real asset
          # names the guard below needs. Both come from the release id: the tag
          # endpoint 404s while the release is a draft.
          manifest=$(gh api "repos/$REPO/releases/$RELEASE_ID")
          base="https://github.com/$REPO/releases/download/$TAG"
          assets=$(printf '%s' "$manifest" \
            | jq '[.assets[] | {key: (.id | tostring), value: .name}] | from_entries')
          names=$(printf '%s' "$manifest" | jq '[.assets[].name]')
          # Built from the tag and the asset name on purpose:
          # browser_download_url points at the draft's untagged-<hash> pseudo
          # path, which stops working once the release is published.
          jq --argjson assets "$assets" --arg base "$base" '
            .platforms |= with_entries(
              .value.url = (
                (.value.url | sub("^.*/releases/assets/"; "")) as $id
                | if $assets[$id] then ($base + "/" + $assets[$id]) else .value.url end
              )
            )' latest.json > latest.rewritten.json
          mv latest.rewritten.json latest.json
          # Fail loudly rather than shipping a manifest the updater cannot use.
          # Every platform URL has to be a plain download link (an api.github.com
          # URL answers 403 to the updater) ...
          bad_urls=$(jq -r --arg base "$base/" '[.platforms[].url | select(startswith($base) | not)] | length' latest.json)
          if [ "$bad_urls" != "0" ]; then
            echo "::error::latest.json has $bad_urls platform URL(s) that are not $base/<file> links"
            jq -r '.platforms | to_entries[] | "\(.key) -> \(.value.url)"' latest.json
            exit 1
          fi
          # ... every one of them has to name an asset that really exists
          # (a link to a missing file breaks updates just as quietly) ...
          bad_names=$(jq -r --argjson names "$names" '[.platforms[].url | split("/")[-1] | select(. as $n | $names | index($n) | not)] | length' latest.json)
          if [ "$bad_names" != "0" ]; then
            echo "::error::latest.json points at $bad_names file(s) that are not release assets"
            jq -r '.platforms | to_entries[] | "\(.key) -> \(.value.url)"' latest.json
            printf '%s' "$names" | jq -r '"assets: " + join(", ")'
            exit 1
          fi
          # ... and the three main platforms have to be there, since a platform
          # that went missing means those installs silently stop updating.
          if ! jq -e '.platforms | has("darwin-aarch64") and has("linux-x86_64") and has("windows-x86_64")' latest.json > /dev/null; then
            echo "::error::latest.json is missing darwin-aarch64 / linux-x86_64 / windows-x86_64"
            jq -r '.platforms | keys[]' latest.json
            exit 1
          fi
          jq -r '.platforms | to_entries[] | "\(.key) -> \(.value.url)"' latest.json
          # --clobber replaces the uploaded manifest (gh deletes the old asset
          # and uploads the new one). If this step fails the job is red and the
          # draft may briefly carry no latest.json — publishing stays a manual
          # step precisely so a human sees that before the updater ever reads
          # it (see the plan's known limitations).
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
          # Prove what the release now serves instead of trusting the upload.
          verify_dir=$(mktemp -d)
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --clobber -D "$verify_dir"
          if ! cmp -s latest.json "$verify_dir/latest.json"; then
            echo "::error::the re-downloaded latest.json differs from the rewritten manifest"
            exit 1
          fi
          echo "latest.json rewritten and verified"
