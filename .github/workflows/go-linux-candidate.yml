name: Go Linux release candidate

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: GitWave Linux release version (X.Y.Z)
        type: string
        required: true

permissions:
  contents: read

jobs:
  linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build official Linux packages on Ubuntu 22.04
        env:
          GITWAVE_RELEASE_VERSION: ${{ inputs.version }}
          GITWAVE_UPDATE_PUBLIC_KEY: ${{ vars.GITWAVE_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          : "${GITWAVE_UPDATE_PUBLIC_KEY:?Missing GITWAVE_UPDATE_PUBLIC_KEY}"
          mkdir "$RUNNER_TEMP/gitwave-linux"
          docker run --rm \
            -e GITWAVE_RELEASE_VERSION -e GITWAVE_UPDATE_PUBLIC_KEY \
            -v "$GITHUB_WORKSPACE:/source:ro" -v "$(go env GOROOT):/go:ro" \
            -v "$RUNNER_TEMP/gitwave-linux:/output" ubuntu:22.04 \
            bash /source/scripts/build-linux-installers.sh
      - name: Verify GitWave v0.11.0 package upgrade and rollback
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/gitwave-v0.11.0"
          mkdir "$old"
          gh release download v0.11.0 --repo "$GITHUB_REPOSITORY" -D "$old" \
            --pattern 'GitWave_0.11.0_amd64.deb' --pattern 'GitWave-0.11.0-1.x86_64.rpm'
          bash scripts/verify-linux-upgrade.sh "$old" "$RUNNER_TEMP/gitwave-linux/candidate/releases" "$RELEASE_VERSION"
      - name: Upload verified release candidates
        uses: actions/upload-artifact@v7
        with:
          name: gitwave-linux-x64-${{ inputs.version }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/gitwave-linux/candidate/releases/*.AppImage
            ${{ runner.temp }}/gitwave-linux/candidate/releases/*.AppImage.sha256
            ${{ runner.temp }}/gitwave-linux/candidate/releases/*.deb
            ${{ runner.temp }}/gitwave-linux/candidate/releases/*.deb.sha256
            ${{ runner.temp }}/gitwave-linux/candidate/releases/*.rpm
            ${{ runner.temp }}/gitwave-linux/candidate/releases/*.rpm.sha256
            ${{ runner.temp }}/gitwave-linux/candidate/git-source/
            ${{ runner.temp }}/gitwave-linux/candidate/gtk-source/
