name: workspace

# The root Cargo workspace: gitwave-core and the GPUI Kit application. The
# Tauri application in src-tauri has its own lockfile and is covered by the
# lint / test workflows.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rustfmt.toml"
      - "crates/**"
      - ".github/workflows/workspace.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rustfmt.toml"
      - "crates/**"
      - ".github/workflows/workspace.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Debug info is most of a build's cache footprint and nothing in CI reads it.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rust:
    name: Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      # The runner image ships Google's Chrome apt source, which
      # intermittently fails `apt-get update` with a hash mismatch;
      # it is irrelevant to this job, so drop it before updating.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.*
          sudo apt-get update
          # cmake for vendored libgit2. The rest mirrors GPUI Kit's
          # script/install-linux.sh (the list its own CI builds with), plus the
          # libxcb pieces Zed's Linux build list names.
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            pkg-config \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libssl-dev \
            libzstd-dev \
            libasound2-dev \
            vulkan-validationlayers \
            libvulkan1
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets --locked
      # Guards against silently losing TLS in vendored libgit2 (git2 0.21
      # dropped `https` from default features; the app then fails every
      # HTTPS fetch with "there is no TLS stream available; class=Ssl (16)").
      # The features are declared in gitwave-core, so both workspaces check them.
      - name: Assert git2 keeps the https feature
        shell: bash
        run: cargo tree -e features --locked | grep -q 'git2 feature "https"'
      # The rust-cache keeps stale libgit2-sys build dirs from older feature
      # sets, so scan every header and pass if any was built with HTTPS instead
      # of picking one blindly. The first assertion is what catches a feature
      # removed from the manifest; this one only confirms some build had it.
      - name: Assert libgit2 built with a TLS transport
        shell: bash
        run: |
          found=0
          for header in $(find target -path '*/out/include/git2_features.h'); do
            found=1
            if grep -q '^#define GIT_HTTPS 1$' "$header"; then
              grep '^#define GIT_\(SECURE_TRANSPORT\|WINHTTP\|OPENSSL\) 1$' "$header" || true
              exit 0
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::git2_features.h not found under target — did the libgit2-sys build script run?"
          else
            echo "::error::git2_features.h lacks GIT_HTTPS — vendored libgit2 has no TLS transport; is the git2 'https' feature still enabled in crates/gitwave-core/Cargo.toml?"
          fi
          exit 1
