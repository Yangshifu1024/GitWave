# GitWave pre-commit hooks — see docs/tech/engineering/00-overview.md
# Install: pre-commit install --install-hooks
# Run manually: pre-commit run --all-files

default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: go-format-check
        name: gofmt check
        entry: bash scripts/go-format.sh
        language: system
        files: ^(cmd|internal)/.*\.go$
